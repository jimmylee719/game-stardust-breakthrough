<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星塵突圍 Stardust Breakout</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="menu" class="overlay" hidden>
  <div class="panel">
    <h1>星塵突圍</h1>
    <div class="sub">STARDUST BREAKOUT</div>
    <label for="name">飛行員代號</label>
    <input id="name" type="text" placeholder="輸入你的名字" autocomplete="off" spellcheck="false">
    <button id="solo" class="primary">單人出擊</button>
    <div class="divider"><span>與朋友連線（最多 4 人）</span></div>
    <div class="row">
      <button id="create">建立房間</button>
      <input id="code" type="text" placeholder="房號" maxlength="4" autocomplete="off" spellcheck="false">
      <button id="join">加入</button>
    </div>
    <div id="err" class="err"></div>
    <div id="best" class="best"></div>
    <ul class="help">
      <li>WASD 移動 · 滑鼠 瞄準 · 左鍵 射擊</li>
      <li>Shift 衝刺（短暫無敵） · 連續擊殺累積 COMBO 倍率</li>
      <li>每波清除後三選一強化 · 每 5 波出現 BOSS</li>
      <li>P 暫停（單人） · M 靜音</li>
    </ul>
  </div>
</div>

<div id="lobby" class="overlay" hidden>
  <div class="panel">
    <div class="sub">房號</div>
    <div id="room-code" class="code">----</div>
    <a id="room-link" class="link" href="#" target="_blank" rel="noopener"></a>
    <button id="copy-link" class="small">複製邀請連結</button>
    <ul id="lobby-players" class="players"></ul>
    <button id="lobby-start" class="primary" hidden>出擊</button>
    <div id="lobby-wait" class="wait" hidden>等待房主開始…</div>
    <button id="lobby-leave" class="small">離開房間</button>
  </div>
</div>

<div id="hint">WASD / 方向鍵 移動 · 滑鼠 瞄準射擊 · Shift 衝刺</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
